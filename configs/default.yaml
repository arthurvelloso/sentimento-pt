# Configuração do projeto. Mudou aqui, muda o experimento: commite junto.

seed: 42

data:
  # CSV fixado por commit no GitHub da B2W Digital (B2W-Reviews01).
  url: https://raw.githubusercontent.com/americanas-tech/b2w-reviews01/4639429ec698d7821fc99a0bc665fa213d9fcd5a/B2W-Reviews01.csv
  sha256: 821fb0bf9f7230b0fba4e4f9fadd75a66d1a9ff0b1657810791d33007eb2ab38 # verificado a cada uso
  raw_path: data/raw/B2W-Reviews01.csv
  text_col: review_text
  rating_col: overall_rating

# Regra do rótulo (também documentada no README): nota -> classe
#   1-2 -> negativo | 3 -> neutro | 4-5 -> positivo
split:
  train: 0.8
  val: 0.1
  test: 0.1
  manifest_path: splits/manifest.csv
  meta_path: splits/meta.json

tfidf:
  word_ngram: [1, 2]
  word_min_df: 2
  word_max_features: 200000
  char_ngram: [2, 5]
  char_min_df: 3
  char_max_features: 300000
  max_iter: 500
  # Hiperparâmetros escolhidos na validação (macro-F1).
  grid:
    C: [0.25, 1.0, 4.0, 16.0]
    class_weight: [null, balanced]

results_path: results/tfidf.json

# Fine-tuning do BERTimbau (src/train_bert.py)
bert:
  model_name: neuralmind/bert-base-portuguese-cased
  max_length_percentile: 95 # cobre 95% dos textos; o resto é truncado
  learning_rate: 3.0e-5 # faixa recomendada para BERT: 2e-5 a 5e-5
  epochs: 3
  batch_size: 32
  eval_batch_size: 128
  warmup_ratio: 0.1 # fração dos passos de treino com LR subindo de 0
  weight_decay: 0.01
  train_subset: null # número inteiro limita o treino (use se passar de ~1 h)
  hub_repo: null # "usuario/nome": sobe o modelo (privado) a cada época
  output_dir: outputs/bertimbau
  results_path: results/bertimbau.json

# LLM aberto em zero-shot e few-shot (src/llm_classify.py)
llm:
  # Apache 2.0; 4 bi de parâmetros, cabe numa T4 em fp16 e usa atenção padrão. O Qwen3.5
  # (mais novo) cai numa implementação lenta sem kernels extras, e não pude medir isso na T4.
  model_name: Qwen/Qwen3-4B
  max_review_chars: 1200 # avaliações maiores são cortadas no prompt
  max_new_tokens: 6 # a resposta é uma palavra
  batch_size: 16
  shots_per_class: 3 # few-shot: 3 exemplos de cada classe (9 no total)
  eval_subset: null # null = teste inteiro (12.618). Numa GPU lenta, use --max-eval 3000
  dev_subset: 600 # subconjunto da validação, para iterar no prompt
# QLoRA no LLM acima (src/qlora.py). Treino em amostra estratificada do treino, 1 época.
qlora:
  train_subset: 12000 # a T4 grátis não comporta o treino inteiro (100.944); 12 mil fica entre os pontos de 10% e 25% da ablação
  epochs: 1
  learning_rate: 2.0e-4 # faixa usual para LoRA: 1e-4 a 3e-4
  micro_batch_size: 8
  grad_accum: 2 # batch efetivo de 16
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  log_every: 25
  hub_repo: null # "usuario/nome": envia o adaptador (privado)
  output_dir: outputs/qlora
  results_path: results/qlora_train.json
